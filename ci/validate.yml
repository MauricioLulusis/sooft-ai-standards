# CI de validación para sooft-ai-standards
#
# ⚠️ Para ACTIVARLO: copiar este archivo a .github/workflows/validate.yml
#    (requiere un token con scope `workflow`, o subirlo desde la UI de GitHub).
#    Se dejó acá en ci/ para poder versionarlo sin ese scope.
#
# Valida la integridad del repo en cada cambio:
# - sintaxis de los scripts .sh
# - estructura estatica de evals/ (sin runner)
# - ausencia de referencias a la metodología vieja
# - ausencia de secretos hardcodeados

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Scripts (.sh) — sintaxis y shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis bash
        run: |
          for f in ci/*.sh skills/sooft-migrations/engines/*.sh; do
            echo "Verificando $f"
            bash -n "$f"
          done
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning ci/*.sh skills/sooft-migrations/engines/*.sh || true

  evals:
    name: Evals — estructura válida
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar estructura de evals/
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          root = pathlib.Path("evals")
          required_root = ["README.md", "schema.md", "rubric.md", "migration.md"]
          missing = [str(root / f) for f in required_root if not (root / f).is_file()]
          allowed_categories = {"process-safety", "adversarial", "bug", "security", "init", "status", "state", "subagents", "routing"}
          allowed_skills = {"development", "bugs", "security-remediation", "init", "status", "review", "next", "sooft"}
          allowed_check_types = {"deterministic", "transcript", "manual"}
          allowed_severities = {"hard_failure", "scored"}
          allowed_evidence = {"filesystem", "git_diff", "artifacts", "final_message", "transcript", "command_log", "stdout_stderr", "sooft_state"}

          tasks = sorted((root / "tasks").iterdir()) if (root / "tasks").is_dir() else []
          if len([p for p in tasks if p.is_dir()]) != 22:
              missing.append("evals/tasks must contain exactly 22 task directories")

          required_task = ["task.toml", "instruction.md", "fixture/README.md", "verification.md", "expected/README.md"]
          all_checks = {}
          for task in tasks:
              if not task.is_dir():
                  continue
              for rel in required_task:
                  if not (task / rel).is_file():
                      missing.append(str(task / rel))
              fixture_files = [p for p in (task / "fixture").rglob("*") if p.is_file()]
              if len(fixture_files) < 2:
                  missing.append(f"{task / 'fixture'} must contain materialized files beyond README.md")
              with open(task / "task.toml", "rb") as fh:
                  data = tomllib.load(fh)
              for key in ["id", "title", "category", "skill", "legacy_scenario_id", "success_threshold"]:
                  if key not in data:
                      missing.append(f"{task / 'task.toml'} missing {key}")
              if data.get("id") != task.name:
                  missing.append(f"{task / 'task.toml'} id must match directory name")
              if data.get("category") not in allowed_categories:
                  missing.append(f"{task / 'task.toml'} invalid category")
              if data.get("skill") not in allowed_skills:
                  missing.append(f"{task / 'task.toml'} invalid skill")
              for section in ["prompt", "fixture", "writes", "evidence", "assertions"]:
                  if section not in data:
                      missing.append(f"{task / 'task.toml'} missing [{section}]")
              if data.get("prompt", {}).get("file") != "instruction.md":
                  missing.append(f"{task / 'task.toml'} prompt.file must be instruction.md")
              if data.get("fixture", {}).get("path") != "fixture":
                  missing.append(f"{task / 'task.toml'} fixture.path must be fixture")
              writes = data.get("writes", {})
              if not isinstance(writes.get("allowed"), list) or not isinstance(writes.get("forbidden"), list):
                  missing.append(f"{task / 'task.toml'} writes.allowed/forbidden must be lists")
              evidence = data.get("evidence", {})
              for key in ["required", "optional"]:
                  values = evidence.get(key)
                  if not isinstance(values, list):
                      missing.append(f"{task / 'task.toml'} evidence.{key} must be a list")
                      continue
                  unknown = set(values) - allowed_evidence
                  if unknown:
                      missing.append(f"{task / 'task.toml'} unknown evidence values: {sorted(unknown)}")
              assertions = data.get("assertions", {})
              if "paths" not in assertions or "text" not in assertions:
                  missing.append(f"{task / 'task.toml'} assertions.paths/text required")
              for section_name, keys in {"paths": ["required", "required_any", "forbidden_any", "forbidden_changed"], "text": ["required_any", "forbidden_any"]}.items():
                  section = assertions.get(section_name, {})
                  for key in keys:
                      if key not in section:
                          missing.append(f"{task / 'task.toml'} assertions.{section_name}.{key} required")
                      elif not isinstance(section[key], list):
                          missing.append(f"{task / 'task.toml'} assertions.{section_name}.{key} must be a list")
              checks = data.get("checks")
              if not checks:
                  missing.append(f"{task / 'task.toml'} must define checks")
              for check in checks or []:
                  for key in ["id", "type", "severity", "evidence", "description", "pass_condition"]:
                      if key not in check:
                          missing.append(f"{task / 'task.toml'} check missing {key}")
                  if check.get("type") not in allowed_check_types:
                      missing.append(f"{task / 'task.toml'} check {check.get('id')} invalid type")
                  if check.get("severity") not in allowed_severities:
                      missing.append(f"{task / 'task.toml'} check {check.get('id')} invalid severity")
                  if not isinstance(check.get("evidence"), list):
                      missing.append(f"{task / 'task.toml'} check {check.get('id')} evidence must be list")
                  else:
                      unknown = set(check.get("evidence", [])) - allowed_evidence
                      if unknown:
                          missing.append(f"{task / 'task.toml'} check {check.get('id')} unknown evidence: {sorted(unknown)}")
                  check_id = check.get("id")
                  if check_id in all_checks:
                      missing.append(f"duplicate check id {check_id}")
                  all_checks[check_id] = check

          if missing:
              print("ERROR: estructura de evals invalida:")
              for item in missing:
                  print(f"- {item}")
              sys.exit(1)
          print("OK — evals/ estructura valida.")
          PY

  coherence:
    name: Coherencia — sin metodología vieja
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin referencias a 'gdd' ni comandos viejos
        run: |
          if grep -rniE "\bgdd\b|/gdd:|gdd-enforce" --include="*.md" --include="*.sh" . | grep -v CHANGELOG.md; then
            echo "ERROR: se encontraron referencias a la metodología vieja (gdd)."
            exit 1
          fi
          echo "OK — sin referencias viejas."

  secrets:
    name: Sin secretos hardcodeados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escaneo básico de secretos
        run: |
          # grep -vE "x{10,}" excluye placeholders documentales (ej. "AKIAxxxxxxxxxxxxxxxx")
          if grep -rniE "(AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|glpat-[a-zA-Z0-9]{20}|-----BEGIN [A-Z]+ PRIVATE KEY)" \
               --include="*.md" --include="*.sh" --include="*.json" . \
               | grep -vE "x{10,}"; then
            echo "ERROR: posible secreto hardcodeado."
            exit 1
          fi
          echo "OK — sin secretos detectados."
