# Spec canónica del hook `session_start`, agnóstica a la herramienta.
#
# Fuente de verdad del CONTENIDO (banner + mensaje) para CUALQUIER herramienta de IA —
# Claude, Copilot, Cursor, o una que todavía no existe. Ninguna herramienta es
# obligatoria ni especial: sin hook nativo, SOOFT funciona igual, porque el mismo
# mensaje ya vive en AGENTS.md / *-instructions.md (siempre activo, sin depender de un
# evento determinista).

event: session_start
description: >
  Se dispara al iniciar o resumir una sesión del agente en un proyecto SOOFT. Lo corre
  el harness de la herramienta, NO el agente — costo cero de tokens de razonamiento.
  Dos efectos: (1) muestra un banner visual, (2) inyecta un recordatorio de contexto que
  obliga a cargar la skill `sooft` antes de tocar código.

banner_file: ../banner.txt
banner_fallback: "=== SOOFT — Sooft Engineering AI Rails ==="

additional_context: >
  Estás en un proyecto SOOFT. Antes de leer, analizar, buscar o escribir código, cargá y
  seguí la skill sooft: discovery obligatorio y gates de aprobación. No escribas código
  sin un plan aprobado. FORMATO: no narres tu razonamiento interno. No digas lo que vas
  a hacer antes de hacerlo. Si necesitás mostrar progreso, una sola línea breve (ej:
  Analizando...). Entregá el resultado directamente. El esfuerzo no cambia, solo el
  texto visible.

# Algoritmo único, igual para CUALQUIER herramienta — sin excepciones ni casos
# privilegiados. Copilot y Claude Code no son "las dos soportadas": son, simplemente,
# las dos veces que ya se corrió este mismo algoritmo y se guardó el resultado.
algoritmo_universal:
  - paso: 1
    accion: >
      ¿Ya existe un adapter verificado para tu herramienta actual en
      `adapters/<herramienta>.json` (o `sooft.json` para Copilot, ver adapters/README.md)?
      Usalo tal cual — no reinventes nada.
  - paso: 2
    accion: >
      Si no existe: ¿tu herramienta actual tiene un mecanismo de hooks nativo (evento
      de inicio de sesión o equivalente) que puedas CONFIRMAR con certeza en este
      momento, contra su propia documentación real? Si sí, traducí este spec
      (banner_fallback + additional_context) a ese formato.
  - paso: 3
    accion: >
      Si NO podés confirmarlo: NO instales nada. PROHIBIDO inventar el nombre de un
      evento o la forma de un payload sin esa confirmación. Avisá al developer que el
      hook nativo no se instaló para esta herramienta y seguí sin bloquear — SOOFT
      funciona igual sin él.
  - paso: 4
    accion: >
      Si en el paso 2 construiste y verificaste un adapter nuevo, guardalo en
      `adapters/<herramienta>.json` antes de seguir. La librería de adapters crece con
      el uso real, herramienta por herramienta — así el próximo developer con esa misma
      herramienta ya la encuentra resuelta en el paso 1.

adapters_verificados: assets/hooks/adapters/ (librería creciente, ver adapters/README.md)

fallback_sin_hooks: >
  Ningún hook es obligatorio para que SOOFT funcione: es un atajo determinista y
  gratuito en tokens para el banner y el recordatorio. Sin él, la misma regla ya está
  en las instrucciones always-on (AGENTS.md, copilot-instructions.md, etc.) y en la
  skill `sooft` — la degradación es silenciosa y segura, nunca un bloqueo.
