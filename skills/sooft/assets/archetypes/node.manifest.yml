# Manifest de ruteo de arquetipo — stack Node.js (incluye NestJS).
# Consumido por skills/sooft/internal/sooft-discovery.md §1.a durante el discovery.
# Rutas de `load`/`on_demand` son relativas a este directorio (skills/sooft/assets/archetypes/).
#
# NestJS no tiene manifest propio: ningún archivo del repo nombra un 4to *.manifest.yml, y
# sooft-discovery.md agrupa "Express/Fastify/NestJS" como frameworks detectados desde el mismo
# package.json de un proyecto Node. Por eso node-nest vive acá como 2do archetype, con precedencia
# sobre el genérico node-express-fastify (framework específico antes que el genérico).
#
# Un solo archetype genérico para Express/Fastify (no hay "original"/"lite": esa partición asumía un
# paquete npm interno corporativo que no aplica a Sooft — la detección se basa en los frameworks
# públicos reales que recomienda tech-stack.md).

detection_order:
  - node-nest
  - node-express-fastify

archetypes:
  node-nest:
    label: Arquetipo backend Node con framework NestJS
    detect:
      # @nestjs/core es paquete público real — no requiere placeholder de redacción.
      package_scopes:
        - "@nestjs/core"
        - "@nestjs/common"
      node_engines: ">=20"
    load:
      - backend-service/nest/README.md
      - backend-service/nest/tech-stack.md
      - backend-service/golden-rules.md
    on_demand:
      http_client:
        - backend-service/nest/README.md
      new_project:
        - backend-service/nest/README.md
      migration:
        - ../../../sooft-migrations/agents/node-migration-agent.md
      tests:
        - ../drivers/node-create-tests.md
      swagger:
        - ../drivers/node-create-swagger.md
    provides:
      - dependency-injection
      - health-checks
      - structured-error-response
    requires:
      - node-20-lts
    absent: []

  node-express-fastify:
    label: Arquetipo backend Node con Express o Fastify
    detect:
      # Señal fuerte: cualquiera de los dos frameworks recomendados en tech-stack.md.
      package_scopes:
        - express
        - fastify
      # Señal de apoyo. Node <20 dispara on_demand.migration (confirmado en sooft-discovery.md).
      node_engines: ">=20"
    load:
      - backend-service/node/README.md
      - backend-service/node/tech-stack.md
      - backend-service/golden-rules.md
    on_demand:
      http_client:
        - backend-service/node/README.md
      new_project:
        - backend-service/node/README.md
      migration:
        - ../../../sooft-migrations/agents/node-migration-agent.md
      tests:
        - ../drivers/node-create-tests.md
      swagger:
        - ../drivers/node-create-swagger.md
    provides:
      - structured-logging
      - http-client
      - otel-tracing
      - health-checks
      - openapi
    requires:
      - node-20-lts
    absent: []
