# Manifest de ruteo de arquetipo — stack Node.js (incluye NestJS).
# Consumido por skills/sooft/internal/sooft-discovery.md §1.a durante el discovery.
# Rutas de `load`/`on_demand` son relativas a este directorio (skills/sooft/assets/archetypes/).
#
# NestJS no tiene manifest propio: ningún archivo del repo nombra un 4to *.manifest.yml, y
# sooft-discovery.md agrupa "Express/Fastify/NestJS" como frameworks detectados desde el mismo
# package.json de un proyecto Node. Por eso node-nest vive acá como 3er archetype, con precedencia
# sobre los genéricos node-original/node-lite (framework específico antes que el genérico).

detection_order:
  - node-nest
  - node-original
  - node-lite

archetypes:
  node-nest:
    label: Arquetipo backend Node con framework NestJS
    detect:
      # @nestjs/core es paquete público real — no requiere placeholder de redacción.
      package_scopes:
        - "@nestjs/core"
        - "@nestjs/common"
      node_engines: ">=20"
    load:
      - backend-service/nest/README.md
      - backend-service/nest/tech-stack.md
      - backend-service/golden-rules.md
    on_demand:
      http_client:
        - backend-service/nest/README.md
      new_project:
        - backend-service/nest/README.md
      migration:
        - ../../../sooft-migrations/agents/node-migration-agent.md
      tests:
        - ../drivers/node-create-tests.md
      swagger:
        - ../drivers/node-create-swagger.md
    provides:
      - dependency-injection
      - health-checks
      - envelope-response
    requires:
      - node-20-lts
    absent: []

  node-original:
    label: Arquetipo backend Node — variante "original" (paridad completa con las librerías compartidas)
    detect:
      # Señal fuerte: el scope interno de las librerías compartidas del proyecto (redactado —
      # sin precedente literal del nombre real en el repo; ver skills-migrations/SKILL.md §evidencia).
      package_scopes:
        - <scope-librerias-sooft>
      # Señal de apoyo. Node <20 dispara on_demand.migration (confirmado en sooft-discovery.md).
      node_engines: ">=20"
    load:
      - backend-service/node/README.md
      - backend-service/node/tech-stack.md
      - backend-service/golden-rules.md
    on_demand:
      http_client:
        - backend-service/node/README.md
      new_project:
        - backend-service/node/README.md
      migration:
        - ../../../sooft-migrations/agents/node-migration-agent.md
      tests:
        - ../drivers/node-create-tests.md
      swagger:
        - ../drivers/node-create-swagger.md
    provides:
      - logging
      - http-client
      - tracing
      - claims
      - health-checks
      - swagger
    requires:
      - node-20-lts
    absent: []

  node-lite:
    label: Arquetipo backend Node — variante "lite" (subset acotado de las librerías compartidas)
    detect:
      package_scopes:
        - <scope-librerias-sooft>
      node_engines: ">=20"
    load:
      - backend-service/node/README.md
      - backend-service/node/tech-stack.md
      - backend-service/golden-rules.md
    on_demand:
      http_client:
        - backend-service/node/README.md
      new_project:
        - backend-service/node/README.md
      migration:
        - ../../../sooft-migrations/agents/node-migration-agent.md
      tests:
        - ../drivers/node-create-tests.md
      swagger:
        - ../drivers/node-create-swagger.md
    provides:
      - logging
      - http-client
      - health-checks
    requires:
      - node-20-lts
    absent:
      - tracing
      - claims
