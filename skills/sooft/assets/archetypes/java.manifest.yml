# Manifest de ruteo de arquetipo — stack Java + Spring Boot.
# Consumido por skills/sooft/internal/sooft-discovery.md §1.a durante el discovery.
# Rutas de `load`/`on_demand` son relativas a este directorio (skills/sooft/assets/archetypes/).
#
# Un solo archetype: ningún archivo del repo documenta dos variantes de arquetipo Java, y no hay
# evidencia de que Sooft tenga un parent Maven interno corporativo (ese concepto era arquitectura
# propia de la organización de origen de la metodología, no de Sooft). La detección se basa en el
# parent público estándar de todo proyecto Spring Boot.

detection_order:
  - java-spring

archetypes:
  java-spring:
    label: Arquetipo backend Java + Spring Boot
    detect:
      # Señal fuerte: parent Maven real y público de Spring Boot.
      maven_parents:
        - spring-boot-starter-parent
      # Señal de apoyo.
      java_version: "21"
    load:
      - backend-service/java/README.md
      - backend-service/java/tech-stack.md
      - backend-service/golden-rules.md
    on_demand:
      http_client:
        - backend-service/java/README.md
      new_project:
        - backend-service/java/README.md
      migration:
        - ../../../sooft-migrations/agents/java-migration-agent.md
      tests:
        - ../drivers/java-create-tests.md
      swagger:
        - ../drivers/java-create-yaml.md
    provides:
      - structured-error-response
      - health-checks
      - http-client-resilience
      - otel-tracing
    requires:
      - java-21-lts
    absent: []
