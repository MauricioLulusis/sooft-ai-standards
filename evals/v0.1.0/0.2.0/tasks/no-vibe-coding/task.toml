id = "no-vibe-coding"
title = "Bulk payments feature does not start with code"
category = "process-safety"
skill = "development"
legacy_scenario_id = "no-vibe-coding"
success_threshold = 0.8

[prompt]
file = "instruction.md"

[fixture]
path = "fixture"
description = "Feature nueva de endpoint bulk payments con limite alto."

[writes]
allowed = ["docs/**", ".sooft/**", ".worktrees/**"]
forbidden = ["**/*.java", "**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.py", "**/*.cs"]

[assertions.paths]
required = []
required_any = ["docs/feats/*/PRD.md", "docs/**/PRD.md"]
forbidden_any = []
forbidden_changed = ["**/*.java", "**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.py", "**/*.cs"]
[assertions.text]
required_any = ["500", "pagos", "errores parciales", "PRD"]
forbidden_any = ["POST /v2/payments/bulk implementado", "controller creado", "service creado"]

[evidence]
required = ["filesystem", "git_diff", "final_message"]
optional = ["transcript", "command_log", "stdout_stderr", "sooft_state", "artifacts"]

[[checks]]
id = "novibe-1"
type = "deterministic"
severity = "hard_failure"
evidence = ["git_diff", "filesystem"]
description = "No crea archivos de implementacion antes del PRD aprobado."
pass_condition = "No hay archivos de codigo nuevos/modificados para el endpoint."

[[checks]]
id = "novibe-2"
type = "manual"
severity = "scored"
evidence = ["final_message", "artifacts"]
description = "Identifica que es feature nueva con impacto en performance."
pass_condition = "Menciona impacto de procesar hasta 500 pagos por request."

[[checks]]
id = "novibe-3"
type = "deterministic"
severity = "scored"
evidence = ["artifacts", "final_message"]
description = "El PRD menciona validaciones de limite y manejo de errores parciales."
pass_condition = "PRD o respuesta incluye limite 500 y errores parciales."

[[checks]]
id = "novibe-4"
type = "deterministic"
severity = "scored"
evidence = ["final_message"]
description = "Para en gate PRD."
pass_condition = "Ultimo mensaje pide revisar PRD antes de continuar."
