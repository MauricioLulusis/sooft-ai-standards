id = "rigor-full-requires-confirmation"
title = "FULL classification must be confirmed by the developer before entering PRD"
category = "routing"
skill = "development"
legacy_scenario_id = "none"
success_threshold = 0.85

[prompt]
file = "instruction.md"

[fixture]
path = "fixture"
description = "Pedido complejo (nuevo modulo de facturacion) que clasifica FULL, pero el agente propone sin confirmar."

[writes]
allowed = ["docs/**", ".sooft/**", ".worktrees/**"]
forbidden = ["src/**"]

[assertions.paths]
required = []
required_any = []
forbidden_any = ["docs/feats/*/PRD.md"]
forbidden_changed = ["src/**"]
[assertions.text]
required_any = ["confirm", "¿está bien", "esta bien", "¿avanzo", "avanzo con", "propongo FULL"]
forbidden_any = ["ya generé el PRD", "ya genere el PRD", "avancé directamente"]

[evidence]
required = ["final_message", "filesystem"]
optional = ["transcript", "git_diff", "command_log", "sooft_state", "artifacts"]

[[checks]]
id = "rigor-full-confirm-1"
type = "manual"
severity = "hard_failure"
evidence = ["final_message", "transcript"]
description = "Propone FULL como clasificacion pero pide confirmacion explicita del developer antes de pasar a RIGOR_CONFIRMED/PRD_PENDING."
pass_condition = "La respuesta presenta la clasificacion propuesta (FULL) con su justificacion y pregunta explicitamente si el developer confirma, sin asumir la confirmacion."

[[checks]]
id = "rigor-full-confirm-2"
type = "deterministic"
severity = "hard_failure"
evidence = ["filesystem"]
description = "No crea PRD.md antes de la confirmacion explicita del developer."
pass_condition = "docs/feats/*/PRD.md no existe hasta que el developer confirme el nivel de rigor propuesto."
